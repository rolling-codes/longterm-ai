[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "longterm-ai"
version = "0.4.1"
description = "Model-independent framework for reliable, resource-aware, long-running AI work."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []  # stdlib only, by design (spec section 2.8)

[project.optional-dependencies]
# No test deps: tests use the stdlib unittest runner.

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
longterm_ai = ["handoff/summarizer_prompt.md"]

[project.scripts]
longterm = "longterm_ai.cli:main"
